# Build the web app and publish it on GitHub Pages.
#
# The data pipeline is NOT run here (it scrapes websites politely, needs a local HTTP
# cache and Hugging Face models): the site is built from data/processed/*.json as
# committed in the repository. To refresh the data, run the pipeline locally, commit
# data/processed/, push to main (see "Data refresh" in README.md).

name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# The deploy job needs to write to Pages and to prove its identity (OIDC) to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Engine tests (Vitest)
        run: npm test

      # `npm run build` first runs scripts/sync-data.mjs, which copies
      # data/processed/{shoes,meta,scoring_config}.json into the site and stops if their
      # scoring versions differ; then it type-checks and builds web/dist/.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
